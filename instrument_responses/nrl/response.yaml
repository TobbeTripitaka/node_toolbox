# Instrument response model for node_toolbox (smartsolo_response.get_response)
title: 'EarthScope (IRIS) Nominal Response Library: DT-SOLO + SmartSolo datalogger'
use: 'The manufacturer-supplied nominal response with the full digital filter chain: use it to see the
  anti-alias FIR filters, their delay and the minimum-phase option.'
source:
- name: NRL datalogger DTCC SmartSolo
  url: https://ds.iris.edu/ds/nrl/datalogger/dtcc/
- name: NRL sensor DTCC DT-SOLO
  url: https://ds.iris.edu/ds/nrl/sensor/dtcc/dt-solo/
- name: NRL web service
  url: https://service.earthscope.org/irisws/nrl/1/
devices:
  IGU-16HR3C:
    sensor: sensor_DTCC_DT-SOLO_LF5_RC1850_RS43000_SG76.6_STgroundVel
    sensor_v_per_m_s: 76.6
    zeros:
    - - 0
      - 0
    - - 0
      - 0
    poles:
    - - -22.2111
      - 22.2178
    - - -22.2111
      - -22.2178
    adc_counts_per_v: 3355440.0
    fir: 4 decimating FIR stages from 32 kHz
    rates_sps:
    - 50
    - 100
    - 125
    - 250
    - 500
    - 1000
  BD3C-5:
    sensor: sensor_DTCC_DT-SOLO-BB_LP5_SG209.4_STgroundVel
    sensor_v_per_m_s: 209.4
    rates_sps:
    - 100
    - 250
    - 500
    - 1000
notes:
- 'File names: <device>_<gain>dB_<rate>sps_<LP|MP>.xml; LP = linear phase, MP = minimum phase (the script''s
  Anti_Alias_Filter 2 / 1). Low cut off (DFOff).'
- No IGU-16HR3C files above 1000 sps exist in the NRL; get_response uses the nearest rate with a warning.
- The NRL also has the optional low-cut IIR filter (DC removal and 1 Hz); for other corners it advises
  replacing the pole by 2 pi fc.
- The overall sensitivity is given at a frequency within the passband (e.g. 210 Hz at 1000 sps).
